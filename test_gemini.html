<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Gemini Test</title></head>
<body>
<h3>Gemini Backend Test</h3>
<button onclick="testModel()">Test configured Gemini model</button>
<pre id="out"></pre>
<script>
async function testModel() {
  const out = document.getElementById('out');
  out.textContent = 'Testing backend...';
  try {
    const res = await fetch('/api/gemini', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: [{parts: [{text: 'Say hello in 3 words'}]}]})
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error?.message || `HTTP ${res.status}`);
    out.textContent = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || 'No text returned';
  } catch (err) { out.textContent = 'Test failed: ' + err.message; }
}
</script>
</body>
</html>
