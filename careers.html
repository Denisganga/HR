<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers — HRImara</title><link rel="stylesheet" href="/styles.css?v=lifecycle-1"></head>
<body class="careers-body"><header class="careers-header"><img src="/hrimara-logo.png" alt="HRImara AI"><div><p class="leave-chart-kicker">BUILD YOUR NEXT CHAPTER</p><h1 id="organisation">Careers</h1><p>Explore opportunities and apply directly.</p></div><a class="btn-secondary" href="/">Staff sign in</a></header><main class="careers-main"><div id="careersStatus" role="status" aria-live="polite">Loading vacancies...</div><section id="careersJobs"></section><section class="card" id="applicationPanel" hidden></section></main>
<script>
let careers;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/work/careers');if(!r.ok)throw Error('Could not load vacancies');careers=await r.json();document.getElementById('organisation').textContent=careers.organisation+' — Careers';document.getElementById('careersStatus').textContent=careers.jobs.length+' open opportunities';document.getElementById('careersJobs').innerHTML=careers.jobs.map(j=>`<article class="card workflow-card"><span class="tag tag-green">Open</span><h2>${esc(j.title)}</h2><p>${esc(j.dept)} · ${esc(j.type)} · Posted ${esc(j.posted)}</p><h3>About the role</h3><p class="career-copy">${esc(j.description||'Contact the organisation for the full role description.')}</p><h3>Requirements</h3><p class="career-copy">${esc(j.requirements||'HR will review relevant qualifications and experience.')}</p><button class="btn-primary" onclick="apply(${j.id})">Apply for this role</button></article>`).join('')||'<p class="card workflow-empty">No open jobs right now. Please check back.</p>';}catch(e){document.getElementById('careersStatus').textContent=e.message;}}
function input(id,label,type='text'){return `<div class="form-group"><label for="${id}">${label}</label><input id="${id}" type="${type}" required ${type==='number'?'min="0" max="70"':''}></div>`;}
function apply(id){const j=careers.jobs.find(j=>j.id===id),test=careers.tests.find(t=>t.jobId===id),panel=document.getElementById('applicationPanel');panel.hidden=false;panel.innerHTML=`<h2>Apply — ${esc(j.title)}</h2><p>HR reviews applications and assessment results. There is no automatic rejection. Share only information needed for this application.</p><form id="applicationForm"><div class="feature-grid">${input('candidateName','Full name')}${input('candidateEmail','Email','email')}${input('institution','Institution attended')}${input('qualification','Qualification / award')}${input('experience','Years of experience','number')}</div><div class="form-group"><label for="statement">Relevant experience and motivation</label><textarea id="statement" required></textarea></div><label class="consent-row"><input id="consent" type="checkbox"> I consent to HR contacting my institution’s official academic registrar to verify this qualification if shortlisted. (Optional)</label>${test?'<h3>Role assessment</h3><p>Choose one answer per question. Responses are scored on the server and considered by HR.</p>'+test.questions.map((q,i)=>`<fieldset class="assessment-question"><legend>${i+1}. ${esc(q.question)}</legend>${q.options.map((o,k)=>`<label class="consent-row"><input type="radio" name="q${i}" value="${k}" required> ${esc(o)}</label>`).join('')}</fieldset>`).join(''):''}<p id="applicationStatus" role="status" aria-live="polite"></p><div class="workflow-actions"><button class="btn-primary" type="submit">Submit application</button><button class="btn-secondary" type="button" onclick="document.getElementById('applicationPanel').hidden=true">Cancel</button></div></form>`;document.getElementById('applicationForm').onsubmit=event=>submit(event,id,test);panel.scrollIntoView({behavior:'smooth'});}
async function submit(event,jobId,test){event.preventDefault();const form=event.target,btn=form.querySelector('[type=submit]'),status=document.getElementById('applicationStatus');btn.disabled=true;const val=id=>document.getElementById(id).value;try{const r=await fetch('/api/work/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jobId,name:val('candidateName'),email:val('candidateEmail'),institution:val('institution'),qualification:val('qualification'),experience:Number(val('experience')),statement:val('statement'),consent:document.getElementById('consent').checked,answers:test?test.questions.map((_,i)=>Number(form.querySelector(`[name=q${i}]:checked`).value)):[]})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Application failed');status.textContent='Application received. Your reference is HRIMARA-'+d.reference+'. HR will review your application.';form.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true);}catch(e){status.textContent=e.message;btn.disabled=false;}}
load();
</script></body></html>
